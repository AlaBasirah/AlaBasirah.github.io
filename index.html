<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بصيرة — أسئلتك في الدين بإجابات من أمهات الكتب</title>
  <meta name="description" content="اسأل عمّا يشكل عليك في الدين، واحصل على إجابة موثّقة من كتب أهل العلم مع ذكر المصدر والصفحة.">
  <meta name="theme-color" content="#0E7C86">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fontLink" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="glow a"></div><div class="glow b"></div>
  <nav class="topbar">
    <div class="links">
      <button class="pill-btn" id="btnMine" data-t="mine_btn" data-f="show_mine">أسئلتي</button>
      <button class="pill-btn" id="btnAccount" data-t="account_btn" data-f="accounts">حسابي</button>
    </div>
  </nav>

  <div class="brand">
    <div class="halo"><img class="logo" data-logo src="assets/mark.svg" alt="شعار بصيرة"></div>
    <h1><span data-brand="name">بصيرة</span></h1>
    <p data-brand="tagline">اسأل عمّا يشكل عليك في الدين… وخذ الجواب من كتب أهل العلم بالمصدر والصفحة</p>
    <div class="ornament" aria-hidden="true">
      <i></i>
      <svg viewBox="0 0 80 80"><polygon fill="#FFC24B" points="40.0,0.0 51.7,11.7 68.3,11.7 68.3,28.3 80.0,40.0 68.3,51.7 68.3,68.3 51.7,68.3 40.0,80.0 28.3,68.3 11.7,68.3 11.7,51.7 0.0,40.0 11.7,28.3 11.7,11.7 28.3,11.7"/></svg>
      <i></i>
    </div>
  </div>

  <svg class="wave" viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#FFFBF4" d="M0,40 C240,80 480,0 720,30 C960,60 1200,10 1440,40 L1440,70 L0,70 Z"/>
  </svg>
</header>

<main>
  <!-- السؤال -->
  <section class="card ask-zone" aria-label="اطرح سؤالك">
    <div class="human-row" data-f="human_chat">
      <button class="human-btn" id="btnHuman">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        <span data-t="human_btn">تحدّث مع إنسان</span>
      </button>
    </div>

    <form class="search" id="askForm">
      <label for="q" class="sr">اكتب سؤالك</label>
      <textarea id="q" rows="1" maxlength="1000" data-tp="placeholder" placeholder="اكتب سؤالك هنا…" required></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="إرسال السؤال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </form>
    <p class="hint" data-t="hint">لا يلزمك تسجيل الدخول. الإجابات مأخوذة من المصادر المعتمدة في الموقع فقط، مع ذكر الكتاب والصفحة.</p>

    <div id="answerArea"></div>
  </section>

  <!-- أكثر الأسئلة -->
  <section class="card" aria-labelledby="faqTitle" data-f="show_faq">
    <h2 class="section-title" id="faqTitle">
      <span class="badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>
      </span>
      <span data-t="faq_title">أكثر ما سأل عنه الزوّار</span>
    </h2>
    <ul class="faq-list" id="faqList">
      <li class="empty">جارٍ التحميل…</li>
    </ul>
    <button class="btn ghost more-btn hidden" id="faqMore" data-t="faq_more">عرض المزيد</button>
  </section>
</main>

<footer class="site">
  <div class="bar"></div>
  <div data-brand="footer_quote">«قُلْ هَٰذِهِ سَبِيلِي أَدْعُو إِلَى اللَّهِ ۚ عَلَىٰ بَصِيرَةٍ»</div>
  <div class="small footer-note" data-t="footer_note"></div>
  <div class="small"><button id="btnSources" data-t="sources_link" data-f="show_sources">المصادر المعتمدة</button> <button id="btnAbout" data-t="about_link" data-f="show_about">عن الموقع</button></div>
</footer>

<div id="modalRoot"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
